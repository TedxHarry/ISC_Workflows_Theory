name: Apply submodule split

on:
  push:
    branches:
      - readability/submodules
    paths:
      - scripts/apply_submodule_split.py

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readability/submodules
          fetch-depth: 0
      - name: Split long modules into reading units
        run: python scripts/apply_submodule_split.py
      - name: Validate course content
        run: python scripts/check_content.py
      - name: Validate Python and site JavaScript
        run: |
          python -m py_compile scripts/check_content.py scripts/check_external_links.py
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/course-site.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/course-site.js
          git diff --check
      - name: Commit generated reading-unit structure
        run: |
          git config user.name "TedxHarry"
          git config user.email "106974482+TedxHarry@users.noreply.github.com"
          git add . ':!.github/workflows/inventory-submodules.yml' ':!.github/workflows/apply-submodule-split.yml' ':!scripts/apply_submodule_split.py'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Split long modules into shorter reading units"
          git push origin HEAD:readability/submodules