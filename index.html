  <div id="app">Loading course...</div>

  <script>
    const modules = [
      { path: '00-orientation', title: 'Module 00: Orientation', category: 'Foundations' },
      { path: '01-the-workflow-model', title: 'Module 01: The Workflow Model', category: 'Foundations' },
      { path: '02-data-variables-and-expressions', title: 'Module 02: Data, Payloads, Variables & JSONPath', category: 'Foundations' },
      { path: '03-triggers', title: 'Module 03: Triggers & Filters', category: 'Building Blocks' },
      { path: '04-operators-and-logic', title: 'Module 04: Operators & Logic', category: 'Building Blocks' },
      { path: '05-actions', title: 'Module 05: Actions & Error Handling', category: 'Building Blocks' },
      { path: '06-forms-and-interactive-workflows', title: 'Module 06: Forms, Approvals & Interactive Workflows', category: 'Building Blocks' },
      { path: '07-testing-debugging-and-execution', title: 'Module 07: Testing, Debugging & Execution', category: 'Operating Workflows' },
      { path: '08-operations-limits-and-governance', title: 'Module 08: Operations, Limits & Governance', category: 'Operating Workflows' },
      { path: '09-when-to-use-workflows', title: 'Module 09: When to Use Workflows and When Not', category: 'Engineering Judgment' },
      { path: '10-use-case-patterns', title: 'Module 10: Real-World Workflow Patterns', category: 'Engineering Judgment' },
      { path: '11-challenges-and-edge-cases', title: 'Module 11: Challenges, Failure Modes & Edge Cases', category: 'Engineering Judgment' },
      { path: '12-readiness-and-paper-design', title: 'Module 12: Readiness & Paper Design', category: 'Engineering Judgment' }
    ];

    const moduleHighlights = {
      '00-orientation': {
        key: 'Workflows are an ISC orchestration capability for coordinating supported processing around configured start conditions.',
        watch: 'Do not reach for a workflow just because it can perform the task. Start by asking which ISC tool naturally owns the requirement.'
      },
      '01-the-workflow-model': {
        key: 'A trigger supplies the starting data, and later steps can read data produced by earlier steps. Think of the workflow as data moving forward through a controlled sequence.',
        watch: 'Never guess a JSONPath from how a field sounds in English. Inspect the real payload and follow the actual nesting.'
      },
      '03-triggers': {
        key: 'Choose the trigger that represents the business event you actually care about. Then inspect the starting data that trigger provides.',
        watch: 'When there is no execution, stay upstream: verify the event or detection boundary and Workflow eligibility before narrowing the problem to the filter.'
      },
      '04-operators-and-logic': {
        key: 'Operators decide, shape, and repeat. Comparisons branch, variables reshape data, and loops repeat work across arrays.',
        watch: 'Loop executions count toward an individual workflow total. Large loops are both a design and an operational concern.'
      },
      '05-actions': {
        key: 'Every action has its own contract. Know what success means, what output it returns, and how long that specific action is allowed to run.',
        watch: 'A successful Manage Access step does not guarantee every requested access change succeeded. Inspect failedAccessRequests when complete success matters.'
      },
      '06-forms-and-interactive-workflows': {
        key: 'Form Submitted starts a workflow, a Form action pauses a running workflow for a recipient, and an Interactive Process is launched by a user from the Launchpad.',
        watch: 'Interactive Message is not a Slack approval prompt. It displays progress information to the user inside an Interactive Process.'
      },
      '02-data-variables-and-expressions': {
        key: 'Reliable workflows start with the real payload. Read the JSON shape first, then write the path that follows that shape.',
        watch: 'Trigger filters and workflow-step JSONPath expressions use different implementations. An expression that works in one place should not be assumed to behave identically in the other.'
      },
      '07-testing-debugging-and-execution': {
        key: 'The first debugging question is whether the workflow started. No execution record and a failed execution are different problems.',
        watch: 'Testing can execute enabled steps for real. Protect live identities and systems with simulation and a sandbox whenever possible.'
      },
      '08-operations-limits-and-governance': {
        key: 'Tenant execution rate limits and individual workflow limits are separate counters with different rules, especially around loop executions.',
        watch: 'Workflow execution history is not a permanent audit archive. Plan external retention if evidence must live longer than the supported history window.'
      },
      '09-when-to-use-workflows': {
        key: 'Workflows are best at event-driven orchestration. Use the access model, transforms, provisioning, rules, or external services when those tools own the job better.',
        watch: 'A workflow being technically capable of doing something is not enough reason to choose it.'
      },
      '10-use-case-patterns': {
        key: 'Patterns are starting points, not recipes. Preserve the trigger choice, data assumptions, failure behavior, and scale reasoning when you adapt one.',
        watch: 'The gotcha in a pattern is often more important than the happy path. Keep the failure condition visible when adapting an example.'
      },
      '11-challenges-and-edge-cases': {
        key: 'Production design is about partial failure, repeat execution, stale state, dependency behavior, and scale, not only the happy path.',
        watch: 'Know the timeout and success semantics of the action you are actually using. There is no single timeout that applies to every workflow action.'
      },
      '12-readiness-and-paper-design': {
        key: 'A strong paper design names the start boundary, required data, decisions, actions, failure handling, replay/concurrency behavior, and the evidence that proves the intended business outcome before anyone opens the builder.',
        watch: 'Do not stop at the happy path. A design is incomplete until you can explain what fails and how the process recovers safely.'
      }
    };

    const officialReferences = {
      '00-orientation': [
        ['Workflows', 'https://documentation.sailpoint.com/saas/help/workflows/index.html'],
        ['Building Workflows', 'https://documentation.sailpoint.com/saas/help/workflows/workflow-build.html']
      ],
      '01-the-workflow-model': [
        ['Building Workflows', 'https://documentation.sailpoint.com/saas/help/workflows/workflow-build.html'],
        ['Workflow Actions', 'https://documentation.sailpoint.com/saas/help/workflows/workflow-actions.html'],
        ['Workflow Operators', 'https://documentation.sailpoint.com/saas/help/workflows/workflow-operators.html']
      ]
    };

    function currentPath() {
      return window.location.hash
        .replace(/^#\/?/, '')
        .split('?')[0]
        .replace(/\.md$/, '')
        .replace(/\/$/, '');
    }

    function currentModuleInfo() {
      const path = currentPath();
      const index = modules.findIndex(function (item) {
        return item.path === path;
      });
      return index >= 0 ? { module: modules[index], index: index } : null;
    }

    function createModuleLink(number, currentModule, includeWord) {
      const index = parseInt(number, 10);
      const target = modules[index];
      const text = includeWord ? 'Module ' + number : number;

      if (!target || (currentModule && target.path === currentModule.path)) {
        return document.createTextNode(text);
      }

      const link = document.createElement('a');
      link.href = '#/' + target.path;
      link.className = 'module-cross-link';
      link.title = 'Open ' + target.title;
      link.textContent = text;
      return link;
    }

    function linkModuleReferences() {
      const content = document.querySelector('.markdown-section');
      const info = currentModuleInfo();
      const currentModule = info ? info.module : null;

      if (!content) {
        return;
      }

      const walker = document.createTreeWalker(
        content,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            const parent = node.parentElement;
            if (!parent || !/\bModules?\s+(?:0[0-9]|1[0-2])\b/.test(node.nodeValue)) {
              return NodeFilter.FILTER_REJECT;
            }
            if (parent.closest('a, code, pre, h1, script, style, .course-navigation, .course-footer, .official-references')) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) {
        textNodes.push(node);
      }

      textNodes.forEach(function (textNode) {
        const text = textNode.nodeValue;
        const fragment = document.createDocumentFragment();
        const pattern = /\bModule\s+(0[0-9]|1[0-2])\b|\bModules\s+((?:0[0-9]|1[0-2])(?:\s*(?:,|and|&)\s*(?:0[0-9]|1[0-2]))+)/g;
        let lastIndex = 0;
        let match;
        let changed = false;

        while ((match = pattern.exec(text)) !== null) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));

          if (match[1]) {
            fragment.appendChild(createModuleLink(match[1], currentModule, true));
            changed = true;
          } else {
            fragment.appendChild(document.createTextNode('Modules '));
            const listText = match[2];
            const numberPattern = /(0[0-9]|1[0-2])/g;
            let listIndex = 0;
            let numberMatch;
            while ((numberMatch = numberPattern.exec(listText)) !== null) {
              fragment.appendChild(document.createTextNode(listText.slice(listIndex, numberMatch.index)));
              fragment.appendChild(createModuleLink(numberMatch[1], currentModule, false));
              listIndex = numberPattern.lastIndex;
            }
            fragment.appendChild(document.createTextNode(listText.slice(listIndex)));
            changed = true;
          }

          lastIndex = pattern.lastIndex;
        }

        if (changed) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
          textNode.parentNode.replaceChild(fragment, textNode);
        }
      });
    }

    function removeLegacyFooterNavigation() {
      const info = currentModuleInfo();
      const content = document.querySelector('.markdown-section');
      if (!info || !content) {
        return;
      }

      const paragraphs = Array.from(content.querySelectorAll('p'));
      const legacy = paragraphs.find(function (p) {
        return /Course home/i.test(p.textContent) && (p.querySelectorAll('a').length >= 2 || /Previous|Next/i.test(p.textContent));
      });

      if (legacy) {
        const previous = legacy.previousElementSibling;
        if (previous && previous.tagName === 'HR') {
          previous.remove();
        }
        legacy.remove();
      }
    }

    function insertModuleCallouts() {
      const info = currentModuleInfo();
      const content = document.querySelector('.markdown-section');
      if (!info || !content) {
        return;
      }

      const highlight = moduleHighlights[info.module.path];
      if (!highlight) {
        return;
      }

      const h1 = content.querySelector('h1');
      const intro = h1 ? h1.nextElementSibling : null;
      if (intro && intro.tagName === 'P' && !content.querySelector('.auto-key-callout')) {
        const box = document.createElement('div');
        box.className = 'callout-key auto-key-callout';
        box.innerHTML = '<span class="callout-label">Key idea</span>' + highlight.key;
        intro.insertAdjacentElement('afterend', box);
      }

      const beforeMoveOn = Array.from(content.querySelectorAll('h2')).find(function (heading) {
        return heading.textContent.trim().toLowerCase() === 'before you move on';
      });

      if (beforeMoveOn && !content.querySelector('.auto-watch-callout')) {
        const box = document.createElement('div');
        box.className = 'callout-warning auto-watch-callout';
        box.innerHTML = '<span class="callout-label">Watch out</span>' + highlight.watch;
        beforeMoveOn.insertAdjacentElement('beforebegin', box);
      }
    }

    function addCopyButtons() {
      const content = document.querySelector('.markdown-section');
      if (!content) {
        return;
      }

      content.querySelectorAll('pre').forEach(function (pre) {
        if (pre.querySelector('.copy-code-button')) {
          return;
        }

        const code = pre.querySelector('code');
        if (!code) {
          return;
        }

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'copy-code-button';
        button.textContent = 'Copy';
        button.setAttribute('aria-label', 'Copy code');
        button.addEventListener('click', function () {
          const text = code.innerText;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              button.textContent = 'Copied';
              setTimeout(function () { button.textContent = 'Copy'; }, 1400);
            });
          }
        });
        pre.appendChild(button);
      });
    }

    function referencesHtml(path) {
      const refs = officialReferences[path] || [];
      if (!refs.length) {
        return '';
      }

      let html = '<section class="official-references"><h2>Official References</h2><ul>';
      refs.forEach(function (ref) {
        html += '<li><a href="' + ref[1] + '" target="_blank" rel="noopener noreferrer">' + ref[0] + '</a></li>';
      });
      html += '</ul></section>';
      return html;
    }

    window.$docsify = {
      name: 'SailPoint ISC Workflows',
      repo: 'TedxHarry/ISC_Workflows_Theory',
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 0,
      maxLevel: 4,
      search: {
        placeholder: 'Search course...',
        noData: 'No results found',
        depth: 4
      },
      plugins: [
        function (hook) {
          hook.afterEach(function (html) {
            const info = currentModuleInfo();

            if (info) {
              const module = info.module;
              html = '<div class="module-category">' + module.category + ' <span class="module-progress">· Module ' + (info.index + 1) + ' of ' + modules.length + '</span></div>' + html;
              html += referencesHtml(module.path);

              const previous = info.index > 0
                ? modules[info.index - 1]
                : { path: '', title: 'Course Home' };
              const next = info.index < modules.length - 1
                ? modules[info.index + 1]
                : null;

              let navigation = '<nav class="course-navigation" aria-label="Course navigation">';
              navigation += '<a class="previous" href="#/' + previous.path + '">' +
                '<span class="nav-label">Previous</span>' +
                '<span class="nav-title">' + previous.title + '</span>' +
                '</a>';

              if (next) {
                navigation += '<a class="next" href="#/' + next.path + '">' +
                  '<span class="nav-label">Next</span>' +
                  '<span class="nav-title">' + next.title + '</span>' +
                  '</a>';
              } else {
                navigation += '<a class="next" href="#/">' +
                  '<span class="nav-label">Course complete</span>' +
                  '<span class="nav-title">Return to Course Home</span>' +
                  '</a>';
              }

              navigation += '</nav>';
              html += navigation;
            }

            return html + '<footer class="course-footer">© TedxHarry · SailPoint ISC Workflows</footer>';
          });

          hook.doneEach(function () {
            const info = currentModuleInfo();
            document.title = info ? info.module.title + ' | SailPoint ISC Workflows' : 'SailPoint ISC Workflows';
            removeLegacyFooterNavigation();
            insertModuleCallouts();
            linkModuleReferences();
            addCopyButtons();
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
