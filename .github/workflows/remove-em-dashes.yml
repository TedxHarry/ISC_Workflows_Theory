name: Remove em dashes

on:
  push:
    branches:
      - cleanup/remove-em-dashes
    paths:
      - .github/workflows/remove-em-dashes.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-em-dashes
          fetch-depth: 0

      - name: Replace em dashes in tracked UTF-8 text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          emdash = chr(0x2014)
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []

          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix() == ".github/workflows/remove-em-dashes.yml":
                  continue

              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              if emdash not in text:
                  continue

              out = []
              for line in text.splitlines(keepends=True):
                  if emdash not in line:
                      out.append(line)
                      continue

                  if re.match(r"^\s*#{1,6}\s", line):
                      line = line.replace(f" {emdash} ", ": ")
                  elif re.match(r"^\s*\|", line):
                      line = line.replace(f" {emdash} ", ": ")

                  line = re.sub(rf"(\*\*[^*\n]+\*\*) {emdash} ", r"\1: ", line)
                  line = re.sub(rf"(`[^`\n]+`) {emdash} ", r"\1: ", line)
                  line = line.replace(f" {emdash} ", " - ")
                  line = line.replace(emdash, "-")
                  out.append(line)

              updated = "".join(out)
              path.write_bytes(updated.encode("utf-8"))
              changed.append(path.as_posix())

          remaining = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix() == ".github/workflows/remove-em-dashes.yml":
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              if emdash in text:
                  remaining.append(path.as_posix())

          if remaining:
              raise SystemExit("Em dashes remain in: " + ", ".join(remaining))

          print(f"Updated {len(changed)} files")
          for path in changed:
              print(path)
          PY

      - name: Remove temporary workflow and validate diff
        shell: bash
        run: |
          rm .github/workflows/remove-em-dashes.yml
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Remove em dashes from repository text"
          git push origin HEAD:cleanup/remove-em-dashes
