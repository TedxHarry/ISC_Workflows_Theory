name: Refine punctuation cleanup

on:
  push:
    branches:
      - cleanup/remove-em-dashes
    paths:
      - .github/workflows/refine-punctuation.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-em-dashes
          fetch-depth: 0

      - name: Apply contextual punctuation refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              "02-data-variables-and-expressions.md": {
                  "It selects the `attribute` property of the first change object - `manager` in this example.":
                  "It selects the `attribute` property of the first change object, which is `manager` in this example.",
              },
              "03-triggers.md": {
                  "5. What does this event prove - and what does it not prove?":
                  "5. What does this event prove, and what does it not prove?",
                  "1. **Business event - what happened?**":
                  "1. **Business event: what happened?**",
                  "2. **Data boundary - what starting information is available?**":
                  "2. **Data boundary: what starting information is available?**",
                  "3. **Natural choice - what kind of requirement maps here?**":
                  "3. **Natural choice: what kind of requirement maps here?**",
                  "4. **Common assumption - what nearby fact should you not infer?**":
                  "4. **Common assumption: what nearby fact should you not infer?**",
                  "What does this event prove - and what remains unproven?":
                  "What does this event prove, and what remains unproven?",
              },
              "04-operators-and-logic.md": {
                  "What happens when that path needs the Workflow to act - and what should the design do when an action does not go as planned?":
                  "What happens when that path needs the Workflow to act, and what should the design do when an action does not go as planned?",
              },
              "05-actions.md": {
                  "That is where Module 06 - Forms, Approvals & Interactive Workflows begins.":
                  "That is where Module 06: Forms, Approvals & Interactive Workflows begins.",
              },
              "06-forms-and-interactive-workflows.md": {
                  "Think of this as **intake - the front door**.":
                  "Think of this as **intake: the front door**.",
              },
              "09-when-to-use-workflows.md": {
                  "**PRIMARY OWNER:** Access model - typically a Role using Access Profiles for identity-criteria-based assignment.":
                  "**PRIMARY OWNER:** Access model, typically a Role using Access Profiles for identity-criteria-based assignment.",
              },
              "COURSE-STATUS.md": {
                  "**Phase:** COMPLETE - final course integration approved and merged to `main`":
                  "**Phase:** COMPLETE. Final course integration approved and merged to `main`",
                  "**Current target:** None - Modules 00–12 are FINAL ACCEPTED":
                  "**Current target:** None. Modules 00–12 are FINAL ACCEPTED",
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          guide = Path("AUTHORING-GUIDE.md")
          text = guide.read_text(encoding="utf-8")
          anchor = "Use these naturally, not as templates.\n"
          rule = "\nDo not use em dashes in course or project prose. Choose commas, colons, semicolons, parentheses, or ordinary hyphens according to the sentence instead.\n"
          if rule.strip() not in text:
              if anchor not in text:
                  raise SystemExit("Authoring guide insertion anchor not found")
              text = text.replace(anchor, anchor + rule, 1)
              guide.write_text(text, encoding="utf-8")

          emdash = chr(0x2014)
          remaining = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix() == ".github/workflows/refine-punctuation.yml":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              if emdash in text:
                  remaining.append(path.as_posix())

          if remaining:
              raise SystemExit("Em dashes remain in: " + ", ".join(remaining))
          PY

      - name: Remove temporary workflow and validate diff
        shell: bash
        run: |
          rm .github/workflows/refine-punctuation.yml
          git diff --check

      - name: Commit refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine punctuation after em dash cleanup"
          git push origin HEAD:cleanup/remove-em-dashes
