name: Apply final reading splits

on:
  push:
    branches:
      - readability/final-splits
    paths:
      - scripts/apply_final_reading_splits.py
      - .github/workflows/apply-final-reading-splits.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: readability/final-splits
          fetch-depth: 0
      - name: Apply final reading-unit splits
        run: python scripts/apply_final_reading_splits.py
      - name: Validate course content
        run: python scripts/check_content.py
      - name: Validate scripts, site JavaScript, and whitespace
        run: |
          python -m py_compile scripts/check_content.py scripts/check_external_links.py
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/course-site.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/course-site.js
          git diff --check
      - name: Report reading-unit sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          text = Path('scripts/check_content.py').read_text(encoding='utf-8')
          line = next(line for line in text.splitlines() if line.startswith('READING_UNITS = '))
          units = ast.literal_eval(line.split('=', 1)[1].strip())
          for name in units:
              print(f'{len(Path(name).read_text(encoding="utf-8").split()):5d}  {name}')
          PY
      - name: Commit final reading-unit structure
        run: |
          git config user.name "TedxHarry"
          git config user.email "106974482+TedxHarry@users.noreply.github.com"
          git add . ':!.github/workflows/audit-remaining-long-modules.yml' ':!.github/workflows/apply-final-reading-splits.yml' ':!scripts/apply_final_reading_splits.py'
          git diff --cached --check
          git commit -m "Split remaining long modules into reading units"
          git push origin HEAD:readability/final-splits
