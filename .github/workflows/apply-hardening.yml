name: Apply repository hardening

on:
  push:
    branches:
      - hardening/course-quality

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/course-quality
          fetch-depth: 0

      - name: Normalize canonical module H1 structure
        run: |
          python - <<'PY'
          from pathlib import Path

          modules = [
              '00-orientation.md',
              '01-the-workflow-model.md',
              '02-data-variables-and-expressions.md',
              '03-triggers.md',
              '04-operators-and-logic.md',
              '05-actions.md',
              '06-forms-and-interactive-workflows.md',
              '07-testing-debugging-and-execution.md',
              '08-operations-limits-and-governance.md',
              '09-when-to-use-workflows.md',
              '10-use-case-patterns.md',
              '11-challenges-and-edge-cases.md',
              '12-readiness-and-paper-design.md',
          ]
          for filename in modules:
              path = Path(filename)
              lines = path.read_text(encoding='utf-8').splitlines()
              seen_h1 = False
              output = []
              in_fence = False
              for line in lines:
                  if line.lstrip().startswith('```'):
                      in_fence = not in_fence
                  if not in_fence and line.startswith('# '):
                      if seen_h1:
                          line = '#' + line
                      else:
                          seen_h1 = True
                  output.append(line)
              path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Apply hardening changes
        run: python .github/scripts/apply_hardening.py

      - name: Validate repository
        run: |
          python scripts/check_content.py
          python -m py_compile scripts/check_content.py scripts/check_external_links.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Remove already merged stale branches
        run: |
          git fetch origin --prune
          protected='main hardening/course-quality course-theory-refactor'
          for remote in $(git branch -r --merged origin/main | sed 's#^[ *]*origin/##' | grep -v '^HEAD$'); do
            case " $protected " in
              *" $remote "*) continue ;;
            esac
            echo "Deleting merged branch: $remote"
            git push origin --delete "$remote" || true
          done

      - name: Commit hardening changes
        run: |
          git config user.name "TedxHarry"
          git config user.email "106974482+TedxHarry@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden course structure and repository quality"
          git push origin HEAD:hardening/course-quality
