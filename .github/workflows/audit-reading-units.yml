name: Audit reading units

on:
  push:
    branches:
      - readability/submodules
    paths:
      - .github/workflows/audit-reading-units.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report reading-unit word counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          text = Path('scripts/check_content.py').read_text(encoding='utf-8')
          line = next(line for line in text.splitlines() if line.startswith('READING_UNITS = '))
          units = ast.literal_eval(line.split('=', 1)[1].strip())
          total = 0
          for name in units:
              count = len(Path(name).read_text(encoding='utf-8').split())
              total += count
              print(f'{count:5d}  {name}')
          print(f'TOTAL {total} words across {len(units)} reading units')
          PY
      - name: Recheck external links after split
        run: python scripts/check_external_links.py