<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SailPoint Identity Security Cloud Workflows theory, design, and engineering guide">
  <title>SailPoint ISC Workflows</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      --course-green: #42b983;
      --course-green-soft: #eef9f4;
      --course-navy: #34445b;
      --course-text: #3e4c5f;
      --course-muted: #6f7b88;
      --course-border: #e6ece9;
      --course-code-bg: #f6f8f7;
    }

    body {
      color: var(--course-text);
    }

    .sidebar .app-name {
      margin: 1.5rem 0 0.35rem;
    }

    .sidebar .app-name-link {
      color: #2f3b4b;
      font-size: 1.45rem;
      line-height: 1.25;
    }

    .sidebar .app-name-link::after {
      content: 'by TedxHarry';
      display: block;
      margin-top: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--course-muted);
      letter-spacing: 0.02em;
    }

    .sidebar-nav {
      padding-top: 0.4rem;
    }

    .sidebar-nav h2 {
      margin: 1.5rem 1rem 0.45rem 0;
      padding: 0;
      border: 0;
      color: #7b8792;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .sidebar-nav ul {
      margin: 0;
    }

    .sidebar-nav li {
      margin: 0.16rem 0;
    }

    .sidebar-nav li a {
      margin-right: 0.55rem;
      padding: 0.48rem 0.72rem;
      border-radius: 6px;
      color: #4d5c6e;
      font-size: 0.93rem;
      line-height: 1.35;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sidebar-nav li a:hover {
      background: #f5f8f6;
      color: #2f8f68;
    }

    .sidebar-nav li.active > a {
      background: var(--course-green-soft);
      color: #2f9f70;
      font-weight: 700;
      border-right: 3px solid var(--course-green);
    }

    .markdown-section {
      max-width: 920px;
      padding: 42px 40px 90px;
      color: var(--course-text);
      font-size: 17px;
      line-height: 1.75;
    }

    .markdown-section p,
    .markdown-section li {
      line-height: 1.75;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: var(--course-navy);
      letter-spacing: -0.015em;
    }

    .markdown-section h1 {
      margin-bottom: 0.7rem;
      font-size: 2.15rem;
      line-height: 1.22;
    }

    .markdown-section h2 {
      margin-top: 2.6rem;
      margin-bottom: 0.8rem;
      font-size: 1.58rem;
      line-height: 1.3;
    }

    .markdown-section h3 {
      margin-top: 2rem;
      font-size: 1.25rem;
    }

    .markdown-section > h1:first-of-type + p,
    .markdown-section .module-category + h1 + p {
      margin-top: 0;
      margin-bottom: 1.6rem;
      color: var(--course-muted);
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .module-category {
      margin-bottom: 0.45rem;
      color: #2f9f70;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .markdown-section code {
      padding: 0.12rem 0.34rem;
      border: 1px solid #edf0ee;
      border-radius: 4px;
      background: #f5f7f6;
    }

    .markdown-section pre {
      margin: 1.5rem 0;
      padding: 1.25rem 1.4rem;
      border: 1px solid var(--course-border);
      border-radius: 8px;
      background: var(--course-code-bg);
      box-shadow: none;
    }

    .markdown-section pre code {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .markdown-section blockquote {
      margin: 1.6rem 0;
      padding: 1rem 1.2rem;
      border-left: 4px solid var(--course-green);
      border-radius: 0 6px 6px 0;
      background: #f6fbf8;
      color: #435365;
    }

    .markdown-section blockquote p:first-child {
      margin-top: 0;
    }

    .markdown-section blockquote p:last-child {
      margin-bottom: 0;
    }

    .module-cross-link {
      color: #2f9f70 !important;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid #b9dfce;
    }

    .module-cross-link:hover {
      color: #257d58 !important;
      border-bottom-color: #2f9f70;
    }

    .course-navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 3.25rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--course-border);
    }

    .course-navigation a {
      display: block;
      padding: 0.9rem 1rem;
      border: 1px solid var(--course-border);
      border-radius: 8px;
      background: #fff;
      color: #35465a;
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .course-navigation a:hover {
      border-color: #b9dfce;
      background: var(--course-green-soft);
    }

    .course-navigation .next {
      text-align: right;
    }

    .course-navigation .nav-label {
      display: block;
      margin-bottom: 0.15rem;
      color: #83908c;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .course-navigation .nav-title {
      color: #2f9f70;
      font-weight: 700;
    }

    .course-footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--course-border);
      color: #7c878f;
      font-size: 0.82rem;
      text-align: center;
    }

    .course-hero {
      margin: 0 0 2.8rem;
      padding: 1rem 0 2.2rem;
      border-bottom: 1px solid var(--course-border);
    }

    .course-hero .hero-kicker {
      margin-bottom: 0.55rem;
      color: #2f9f70;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .course-hero h1 {
      margin: 0 0 0.4rem;
      font-size: 2.4rem;
    }

    .course-hero .hero-subtitle {
      margin: 0 0 0.6rem;
      color: #59697c;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .course-hero .hero-author {
      margin: 0.35rem 0 1.25rem;
      color: #6f7b88;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .course-hero .hero-description {
      max-width: 760px;
      margin-bottom: 1.4rem;
      color: #4b5b6d;
      font-size: 1.02rem;
      line-height: 1.7;
    }

    .start-button {
      display: inline-block;
      padding: 0.72rem 1.05rem;
      border-radius: 7px;
      background: var(--course-green);
      color: #fff !important;
      font-weight: 700;
      text-decoration: none !important;
    }

    .start-button:hover {
      background: #37a977;
    }

    .course-stats {
      margin: 0 0 2rem;
      color: #78858f;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin: 1.2rem 0 2.5rem;
    }

    .course-card {
      padding: 1.15rem 1.2rem;
      border: 1px solid var(--course-border);
      border-top: 3px solid #b7dfce;
      border-radius: 8px;
      background: #fff;
    }

    .course-card h3 {
      margin: 0 0 0.7rem;
      color: var(--course-navy);
      font-size: 1.05rem;
    }

    .course-card ul {
      margin: 0;
      padding-left: 1.15rem;
    }

    .course-card li {
      margin: 0.28rem 0;
      font-size: 0.94rem;
      line-height: 1.5;
    }

    .callout-key,
    .callout-example,
    .callout-warning,
    .callout-note {
      margin: 1.6rem 0;
      padding: 1rem 1.15rem;
      border: 1px solid var(--course-border);
      border-left: 4px solid var(--course-green);
      border-radius: 7px;
      background: #f8fbf9;
    }

    .callout-label {
      display: block;
      margin-bottom: 0.35rem;
      color: #2f8f68;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media screen and (max-width: 900px) {
      .markdown-section {
        max-width: 100%;
        padding: 32px 24px 72px;
        font-size: 16px;
      }

      .course-grid,
      .course-navigation {
        grid-template-columns: 1fr;
      }

      .course-navigation .next {
        text-align: left;
      }

      .course-hero h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading course...</div>

  <script>
    const modules = [
      { path: '00-orientation', title: 'Module 00: Orientation', category: 'Foundations' },
      { path: '01-the-workflow-model', title: 'Module 01: The Workflow Model', category: 'Foundations' },
      { path: '02-triggers', title: 'Module 02: Triggers', category: 'Workflow Building Blocks' },
      { path: '03-operators-and-logic', title: 'Module 03: Operators and Logic', category: 'Workflow Building Blocks' },
      { path: '04-actions', title: 'Module 04: Actions', category: 'Workflow Building Blocks' },
      { path: '05-forms-and-interactive-workflows', title: 'Module 05: Forms and Interactive Workflows', category: 'Workflow Building Blocks' },
      { path: '06-data-variables-and-expressions', title: 'Module 06: Data, Variables and Expressions', category: 'Workflow Building Blocks' },
      { path: '07-testing-debugging-and-execution', title: 'Module 07: Testing, Debugging and Execution', category: 'Testing and Operations' },
      { path: '08-operations-limits-and-governance', title: 'Module 08: Operations, Limits and Governance', category: 'Testing and Operations' },
      { path: '09-when-to-use-workflows', title: 'Module 09: When to Use Workflows', category: 'Design and Architecture' },
      { path: '10-use-case-patterns', title: 'Module 10: Use Case Patterns', category: 'Design and Architecture' },
      { path: '11-challenges-and-edge-cases', title: 'Module 11: Challenges and Edge Cases', category: 'Design and Architecture' },
      { path: '12-readiness-and-paper-design', title: 'Module 12: Readiness and Paper Design', category: 'Design and Architecture' }
    ];

    function currentPath() {
      return window.location.hash
        .replace(/^#\/?/, '')
        .split('?')[0]
        .replace(/\.md$/, '')
        .replace(/\/$/, '');
    }

    function linkModuleReferences() {
      const content = document.querySelector('.markdown-section');
      const path = currentPath();
      const currentModule = modules.find(function (item) {
        return item.path === path;
      });

      if (!content) {
        return;
      }

      const moduleByNumber = {};
      modules.forEach(function (item, index) {
        moduleByNumber[String(index).padStart(2, '0')] = item;
      });

      const walker = document.createTreeWalker(
        content,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            const parent = node.parentElement;
            if (!parent || !/\bModule\s+(0[0-9]|1[0-2])\b/.test(node.nodeValue)) {
              return NodeFilter.FILTER_REJECT;
            }

            if (parent.closest('a, code, pre, h1, script, style, .course-navigation, .course-footer')) {
              return NodeFilter.FILTER_REJECT;
            }

            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) {
        textNodes.push(node);
      }

      textNodes.forEach(function (textNode) {
        const text = textNode.nodeValue;
        const fragment = document.createDocumentFragment();
        const pattern = /\bModule\s+(0[0-9]|1[0-2])\b/g;
        let lastIndex = 0;
        let match;
        let changed = false;

        while ((match = pattern.exec(text)) !== null) {
          const target = moduleByNumber[match[1]];

          fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));

          if (target && (!currentModule || target.path !== currentModule.path)) {
            const link = document.createElement('a');
            link.href = '#/' + target.path;
            link.className = 'module-cross-link';
            link.title = 'Open ' + target.title;
            link.textContent = match[0];
            fragment.appendChild(link);
            changed = true;
          } else {
            fragment.appendChild(document.createTextNode(match[0]));
          }

          lastIndex = pattern.lastIndex;
        }

        if (changed) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
          textNode.parentNode.replaceChild(fragment, textNode);
        }
      });
    }

    window.$docsify = {
      name: 'SailPoint ISC Workflows',
      repo: 'TedxHarry/ISC_Workflows_Theory',
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 0,
      maxLevel: 4,
      search: {
        placeholder: 'Search course...',
        noData: 'No results found',
        depth: 4
      },
      plugins: [
        function (hook) {
          hook.afterEach(function (html) {
            const path = currentPath();
            const index = modules.findIndex(function (item) {
              return item.path === path;
            });

            if (index >= 0) {
              const module = modules[index];
              html = '<div class="module-category">' + module.category + '</div>' + html;

              const previous = index > 0
                ? modules[index - 1]
                : { path: '', title: 'Course Home' };

              const next = index < modules.length - 1
                ? modules[index + 1]
                : null;

              let navigation = '<nav class="course-navigation" aria-label="Course navigation">';
              navigation += '<a class="previous" href="#/' + previous.path + '">' +
                '<span class="nav-label">Previous</span>' +
                '<span class="nav-title">' + previous.title + '</span>' +
                '</a>';

              if (next) {
                navigation += '<a class="next" href="#/' + next.path + '">' +
                  '<span class="nav-label">Next</span>' +
                  '<span class="nav-title">' + next.title + '</span>' +
                  '</a>';
              } else {
                navigation += '<a class="next" href="#/">' +
                  '<span class="nav-label">Course complete</span>' +
                  '<span class="nav-title">Return to Course Home</span>' +
                  '</a>';
              }

              navigation += '</nav>';
              html += navigation;
            }

            return html + '<footer class="course-footer">© TedxHarry · SailPoint ISC Workflows</footer>';
          });

          hook.doneEach(function () {
            linkModuleReferences();
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
