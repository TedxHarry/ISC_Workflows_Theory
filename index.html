    function currentPath() {
      return window.location.hash
        .replace(/^#\/?/, '')
        .split('?')[0]
        .replace(/\.md$/, '')
        .replace(/\/$/, '');
    }

    function currentReadingInfo() {
      const path = currentPath();
      const index = readingUnits.findIndex(function (item) {
        return item.path === path;
      });
      return index >= 0 ? { unit: readingUnits[index], index: index } : null;
    }

    function currentModuleInfo() {
      const path = currentPath();
      let index = modules.findIndex(function (item) {
        return item.path === path;
      });
      if (index >= 0) {
        return { module: modules[index], index: index };
      }

      const unitInfo = currentReadingInfo();
      if (!unitInfo) {
        return null;
      }
      index = modules.findIndex(function (item) {
        return item.number === unitInfo.unit.moduleNumber;
      });
      return index >= 0 ? { module: modules[index], index: index } : null;
    }

    function createModuleLink(number, currentModule, includeWord) {
      const index = parseInt(number, 10);
      const target = modules[index];
      const text = includeWord ? 'Module ' + number : number;

      if (!target || (currentModule && target.path === currentModule.path)) {
        return document.createTextNode(text);
      }

      const link = document.createElement('a');
      link.href = '#/' + target.path;
      link.className = 'module-cross-link';
      link.title = 'Open ' + target.title;
      link.textContent = text;
      return link;
    }

    function normalizeCourseLinks() {
      const content = document.querySelector('.markdown-section');
      if (!content) {
        return;
      }

      const modulePaths = new Set(modules.map(function (item) { return item.path; }).concat(readingUnits.map(function (item) { return item.path; })));
      content.querySelectorAll('a[href$=".md"]').forEach(function (link) {
        const href = link.getAttribute('href');
        if (!href) {
          return;
        }
        const path = href.replace(/^\.\//, '').replace(/\.md$/, '');
        if (modulePaths.has(path)) {
          link.setAttribute('href', '#/' + path);
        }
      });
    }

    function linkModuleReferences() {
      const content = document.querySelector('.markdown-section');
      const info = currentModuleInfo();
      const currentModule = info ? info.module : null;

      if (!content) {
        return;
      }

      const walker = document.createTreeWalker(
        content,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            const parent = node.parentElement;
            if (!parent || !/\bModules?\s+(?:0[0-9]|1[0-2])\b/.test(node.nodeValue)) {
              return NodeFilter.FILTER_REJECT;
            }
            if (parent.closest('a, code, pre, h1, script, style, .course-navigation, .course-footer, .official-references')) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) {
        textNodes.push(node);
      }

      textNodes.forEach(function (textNode) {
        const text = textNode.nodeValue;
        const fragment = document.createDocumentFragment();
        const pattern = /\bModule\s+(0[0-9]|1[0-2])\b|\bModules\s+((?:0[0-9]|1[0-2])(?:\s*(?:,|and|&)\s*(?:0[0-9]|1[0-2]))+)/g;
        let lastIndex = 0;
        let match;
        let changed = false;

        while ((match = pattern.exec(text)) !== null) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));

          if (match[1]) {
            fragment.appendChild(createModuleLink(match[1], currentModule, true));
            changed = true;
          } else {
            fragment.appendChild(document.createTextNode('Modules '));
            const listText = match[2];
            const numberPattern = /(0[0-9]|1[0-2])/g;
            let listIndex = 0;
            let numberMatch;
            while ((numberMatch = numberPattern.exec(listText)) !== null) {
              fragment.appendChild(document.createTextNode(listText.slice(listIndex, numberMatch.index)));
              fragment.appendChild(createModuleLink(numberMatch[1], currentModule, false));
              listIndex = numberPattern.lastIndex;
            }
            fragment.appendChild(document.createTextNode(listText.slice(listIndex)));
            changed = true;
          }

          lastIndex = pattern.lastIndex;
        }

        if (changed) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
          textNode.parentNode.replaceChild(fragment, textNode);
        }
      });
    }

    function removeLegacyFooterNavigation() {
      const info = currentModuleInfo();
      const content = document.querySelector('.markdown-section');
      if (!info || !content) {
        return;
      }

      const paragraphs = Array.from(content.querySelectorAll('p'));
      const legacy = paragraphs.find(function (p) {
        return /Course home/i.test(p.textContent) && (p.querySelectorAll('a').length >= 2 || /Previous|Next/i.test(p.textContent));
      });

      if (legacy) {
        const previous = legacy.previousElementSibling;
        if (previous && previous.tagName === 'HR') {
          previous.remove();
        }
        legacy.remove();
      }
    }

    function addCopyButtons() {
      const content = document.querySelector('.markdown-section');
      if (!content) {
        return;
      }

      content.querySelectorAll('pre').forEach(function (pre) {
        if (pre.querySelector('.copy-code-button')) {
          return;
        }

        const code = pre.querySelector('code');
        if (!code) {
          return;
        }

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'copy-code-button';
        button.textContent = 'Copy';
        button.setAttribute('aria-label', 'Copy code');
        button.setAttribute('aria-live', 'polite');
        button.addEventListener('click', function () {
          const text = code.innerText;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              button.textContent = 'Copied';
              setTimeout(function () { button.textContent = 'Copy'; }, 1400);
            }).catch(function () {
              button.textContent = 'Copy failed';
              setTimeout(function () { button.textContent = 'Copy'; }, 1400);
            });
          } else {
            button.textContent = 'Copy unavailable';
            setTimeout(function () { button.textContent = 'Copy'; }, 1400);
          }
        });
        pre.appendChild(button);
      });
    }

    window.$docsify = {
      name: 'SailPoint ISC Workflows',
      repo: 'TedxHarry/ISC_Workflows_Theory',
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 0,
      maxLevel: 4,
      search: {
        placeholder: 'Search course...',
        noData: 'No results found',
        depth: 4
      },
      plugins: [
        function (hook) {
          hook.afterEach(function (html) {
            const unitInfo = currentReadingInfo();
            const moduleInfo = currentModuleInfo();

            if (unitInfo) {
              const unit = unitInfo.unit;
              let progress = '· Module ' + unit.moduleNumber;
              if (unit.partCount > 1) {
                progress += ' · Part ' + unit.part + ' of ' + unit.partCount;
              }
              progress += ' · Reading unit ' + (unitInfo.index + 1) + ' of ' + readingUnits.length;
              html = '<div class="module-category">' + unit.category + ' <span class="module-progress">' + progress + '</span></div>' + html;

              const previous = unitInfo.index > 0
                ? readingUnits[unitInfo.index - 1]
                : { path: '', title: 'Course Home' };
              const next = unitInfo.index < readingUnits.length - 1
                ? readingUnits[unitInfo.index + 1]
                : null;

              let navigation = '<nav class="course-navigation" aria-label="Course navigation">';
              navigation += '<a class="previous" href="#/' + previous.path + '">' +
                '<span class="nav-label">Previous</span>' +
                '<span class="nav-title">' + previous.title + '</span>' +
                '</a>';

              if (next) {
                navigation += '<a class="next" href="#/' + next.path + '">' +
                  '<span class="nav-label">Next</span>' +
                  '<span class="nav-title">' + next.title + '</span>' +
                  '</a>';
              } else {
                navigation += '<a class="next" href="#/">' +
                  '<span class="nav-label">Course complete</span>' +
                  '<span class="nav-title">Return to Course Home</span>' +
                  '</a>';
              }

              navigation += '</nav>';
              html += navigation;
            } else if (moduleInfo) {
              const module = moduleInfo.module;
              html = '<div class="module-category">' + module.category + ' <span class="module-progress">· Module ' + module.number + ' overview</span></div>' + html;
            }

            return html + '<footer class="course-footer">© TedxHarry · SailPoint ISC Workflows</footer>';
          });

          hook.doneEach(function () {
            const mainContent = document.querySelector('.markdown-section');
            if (mainContent) {
              mainContent.id = 'main-content';
              mainContent.setAttribute('tabindex', '-1');
            }

            const activeSidebarLink = document.querySelector('.sidebar-nav li.active > a');
            if (activeSidebarLink) {
              activeSidebarLink.setAttribute('aria-current', 'page');
            }
            const unitInfo = currentReadingInfo();
            const moduleInfo = currentModuleInfo();
            document.title = unitInfo ? unitInfo.unit.title + ' | SailPoint ISC Workflows' : (moduleInfo ? moduleInfo.module.title + ' | SailPoint ISC Workflows' : 'SailPoint ISC Workflows');
            removeLegacyFooterNavigation();
            normalizeCourseLinks();
            linkModuleReferences();
            addCopyButtons();
          });
        }
      ]
    };
  </script>
